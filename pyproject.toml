[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-rip"
version = "0.2.0"
description = "Save stories from Literotica, StoriesOnline, and MCStories as Markdown or plain text."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "FanFicFare==4.61.0",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=1.2,<2",
    "html2text>=2024.2.26",
    "requests>=2.25.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lit-rip = "lit_rip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lit_rip = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
